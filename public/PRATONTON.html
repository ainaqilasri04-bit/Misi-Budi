M['scoring']=(()=>{
const {QUESTIONS,PROVERBS}=M['data'];
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function validChoice(q,a){return q.type==='sequence'?Array.isArray(a)&&a.length===q.options.length&&new Set(a).size===a.length&&a.every(x=>Number.isInteger(x)&&x>=0&&x<q.options.length):Number.isInteger(a)&&a>=0&&a<q.options.length;}
function grade(q,tries=[]){const index=tries.findIndex(a=>same(a,q.answer));return index<0?0:index===0?5:3;}
function total(attempts={}){return QUESTIONS.reduce((s,q)=>s+grade(q,attempts[q.id]),0);}
function completed(attempts={}){return QUESTIONS.filter(q=>grade(q,attempts[q.id])>0).length;}
function badges(attempts={}){return PROVERBS.filter(q=>(attempts[q.id]||[]).some(a=>same(a,q.answer))).length;}
function skillStats(attempts={}){const out={};for(const q of QUESTIONS){out[q.skill]??={first:0,solved:0,total:0};const s=out[q.skill];s.total++;if(grade(q,attempts[q.id])===5)s.first++;if(grade(q,attempts[q.id])>0)s.solved++;}return out;}
function rankRows(rows){const complete=rows.filter(r=>r.done).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'ms'));let prev=null,rank=0;return [...complete.map((r,i)=>{if(r.score!==prev)rank=i+1;prev=r.score;return {...r,rank};}),...rows.filter(r=>!r.done).map(r=>({...r,rank:null}))];}

return {same,validChoice,grade,total,completed,badges,skillStats,rankRows};})();

k timbul pada helaian itu. Budi pun menuju ke teluk.":{"start":2579.86,"duration":63.504},"“Mari kita bantu,” kata Aina. Dari atas Budi, Aina mengangkat sampah dengan jaring. Ravi memegang bakul. “Kamu berdua bagai aur dengan tebing,” kata Budi.":{"start":2643.864,"duration":15.24},"Di Teluk Penyu, Budi membuka pelampungnya. Kereta itu terapung di atas air biru. Aina dan Ravi kekal di dalamnya. Seekor penyu kecil hendak ke laut. Namun, botol dan plastik menutup laluan di bawah jeti. “Mari kita bantu,” kata Aina. Dari atas Budi, Aina mengangkat sampah dengan jaring. Ravi memegang bakul. “Kamu berdua bagai aur dengan tebing,” kata Budi. Mereka membawa sampah ke pusat kitar semula. “Sampah ini bukan milik kita, tetapi teluk ini tempat kita bersama,” kata Ravi. Laluan kini bersih. Penyu berenang ke laut. Di bawah cangkerang di jeti, terselit helaian ketiga! Aina dan Ravi membasuh tangan sebelum makan. Helaian itu menunjukkan bintang. “Kita ke angkasa!” seru Aina.":{"start":2659.604,"duration":65.904},"Mereka berbincang dan bersetuju membahagi tugas. “Bulat air kerana pembetung, bulat kata kerana muafakat,” kata Nuri. Aina membaca arahan. Ravi menekan suis yang ditunjukkan oleh Nuri.":{"start":2726.008,"duration":17.232},"Budi berubah menjadi kereta angkasa. Mereka tiba di Stesen Bintang, sebuah taman dalam kubah kaca. Ravi tertekan suis merah. Lampu panduan padam. “Saya yang tertekan suis itu,” aku Ravi kepada robot Nuri. “Terima kasih kerana berkata benar,” kata Nuri. Nuri menunjukkan cara memulihkan lampu dengan selamat. Mereka berbincang dan bersetuju membahagi tugas. “Bulat air kerana pembetung, bulat kata kerana muafakat,” kata Nuri. Aina membaca arahan. Ravi menekan suis yang ditunjukkan oleh Nuri. Lampu panduan menyala semula. Nuri menyerahkan helaian terakhir. Empat helaian kini kembali ke Buku Budi. “Buku ini menyimpan perbuatan baik kita,” kata Aina. Mereka pulang membawa kerjasama, keprihatinan, tanggungjawab dan kejujuran.":{"start":2743.74,"duration":67.08} M['audio']=(()=>{
const manifest=M['audio-manifest'].default;
const normal=text=>String(text??'').replaceAll('|','').replace(/\s+/g,' ').trim();
const players=new Map(),metadataTasks=new WeakMap();
let generation=0,watch=0;
function mark(button){document.querySelectorAll('.audio-speaking').forEach(el=>{el.classList.remove('audio-speaking');el.setAttribute('aria-pressed','false');});if(button){button.classList.add('audio-speaking');button.setAttribute('aria-pressed','true');}}
function stopMalay(){generation++;for(const player of players.values())player.pause();cancelAnimationFrame(watch);mark(null);}
function audioStatus(){return 'Bacaan Bahasa Melayu Malaysia. Tekan Dengar untuk mengulang. Pilih kelajuan yang selesa. Tekan Henti suara apabila perlu.';}
function getPlayer(asset){const key=['support','adaptive'].includes(asset)?asset:'main';if(!players.has(key)){const source=key==='adaptive'?new URL('./assets/audio/bacaan-latihan.mp3',document.baseURI):key==='support'?new URL('./assets/audio/bacaan-bantuan.mp3',document.baseURI):new URL('./assets/audio/bacaan-melayu.mp3',document.baseURI);const player=new Audio(source);player.preload='metadata';players.set(key,player);}return players.get(key);}
async function waitMetadata(audio){if(audio.readyState>=1)return;if(!metadataTasks.has(audio)){const task=new Promise((resolve,reject)=>{const timer=setTimeout(()=>finish(new Error('Muat turun audio mengambil masa.')),14000);function finish(error){clearTimeout(timer);audio.removeEventListener('loadedmetadata',ready);audio.removeEventListener('error',failed);error?reject(error):resolve();}const ready=()=>finish(),failed=()=>finish(new Error('Fail audio tidak dapat dimuatkan.'));audio.addEventListener('loadedmetadata',ready,{once:true});audio.addEventListener('error',failed,{once:true});audio.load();}).finally(()=>metadataTasks.delete(audio));metadataTasks.set(audio,task);}await metadataTasks.get(audio);}
// Use only the supplied ms-MY recordings. Device voices must never replace them.
async function speakMalay(text,{rate=.85,notify=()=>{},button:sourceButton=null}={}){
 stopMalay();const token=generation,key=normal(text),clip=manifest[key];
 const button=sourceButton||[...document.querySelectorAll('[data-audio]')].find(b=>normal(b.dataset.audio)===key);
 if(!clip){notify('Bacaan Bahasa Melayu ini belum tersedia. Kamu boleh membaca teks bersama guru.');return;}
 mark(button);let player;
 try{
  player=getPlayer(clip.asset);await waitMetadata(player);if(token!==generation)return;
  player.preservesPitch=true;player.playbackRate=Number(rate)===.7?.83:Number(rate)===1?1.1:1;
  player.currentTime=clip.start;const end=clip.start+clip.duration;await player.play();if(token!==generation)return;
  const check=()=>{if(token!==generation)return;if(player.currentTime>=end-.025||player.ended){player.pause();mark(null);return;}watch=requestAnimationFrame(check);};check();
 }catch(e){if(token!==generation)return;if(player)player.pause();mark(null);notify('Rakaman Bahasa Melayu belum dapat dimainkan. Tekan Dengar untuk mencuba lagi. Teks masih boleh dibaca bersama guru.');}
}

return {stopMalay,audioStatus,speakMalay};})();

 if(raw?.format!=='misi-budi-buku-kumpulan'||raw.version!==1||!Array.isArray(raw.members)||raw.members.length<2||raw.members.length>6||!raw.members.every(n=>typeof n==='string'&&n.trim())||typeof raw.team!=='string'||!raw.team.trim())throw Error('Fail ini bukan fail sambungan Buku Peribahasa Budi yang sah.');
 const out=newGroup(raw.team.trim(),raw.members.map(s=>s.trim()));
 for(const h of HUNTS){const p=raw.pages?.[h.id];if(!p)continue;
  const history=(Array.isArray(p.history)?p.history:[]).slice(-20).map((v,i)=>({number:i+1,at:text(v.at,40),draft:cleanDraft(v.draft,out.members,h.page),reason:text(v.reason),review:v.review?{by:text(v.review.by,60),praise:text(v.review.praise),suggestion:text(v.review.suggestion),base:i}:null}));
  out.pages[h.id]={found:p.found===true,draft:cleanDraft(p.draft,out.members,h.page),history,review:p.review&&p.review.base===history.length?{by:text(p.review.by,60),praise:text(p.review.praise),suggestion:text(p.review.suggestion),base:history.length}:null,reviewDraft:{by:text(p.reviewDraft?.by,60),praise:text(p.reviewDraft?.praise),suggestion:text(p.reviewDraft?.suggestion)},reason:text(p.reason)};
 }return out;

function ensurePage(book,id){const h=HUNTS.find(h=>h.id===id);if(!h)throw Error('Halaman tidak ditemui.');return book.pages[id]??=( {found:false,draft:pageDraft(h.page),history:[],review:null,reviewDraft:{by:'',praise:'',suggestion:''},reason:''});}

function commitDraft(book,p){const error=draftError(book,p);if(error)throw Error(error);if(p.history.length)throw Error('Draf pertama sudah disimpan. Gunakan langkah Baiki.');p.history.push({number:1,at:new Date().toISOString(),draft:structuredClone(p.draft),reason:'Draf pertama hasil perbincangan.',review:null});}
function commitReview(p){if(!p.history.length)throw Error('Simpan draf pertama dahulu.');const r=p.reviewDraft;if(['by','praise','suggestion'].some(k=>!r[k]?.trim()))throw Error('Isi nama kumpulan penyemak, pujian dan cadangan pembaikan.');p.review={...structuredClone(r),base:p.history.length};}

 function mission(){const x=h(),a=p();if(!allowed(step))step=0;frame(`<div class="wrap group-wrap">${title(`Misi ${HUNTS.indexOf(x)+1} · ${PLACES[x.world].name}`)}${roles()}<nav class="group-steps" aria-label="Langkah buku kumpulan">${GROUP_STEPS.map((s,i)=>button('step',`${i+1}. ${s}`,`data-step="${i}" ${allowed(i)?'':'disabled'} ${i===step?'aria-current="step"':''}`,i===step?'teal':'light')).join('')}</nav>${errBox()}${[huntScreen,editor,reviewScreen,editor,shareScreen][step]()}<p id="group-save-state" class="muted" role="status">Draf disimpan pada pelayar ini.</p></div>`);}
 function huntCard(x,found,individual=false){const l=LEVELS[x.world],v=proverb(x.id);return `<section class="group-hunt" data-hunt="${x.id}"><div class="group-story-picture" role="img" aria-label="${esc(l.captions[x.page])}">${storyIllustration(x.world,x.page)}</div><div class="read-area"><p class="eyebrow">${l.title} · HALAMAN ${x.page+1}</p>${audioBtn(l.panels[x.page],'Dengar petikan cerita')}${reader(`hunt-${individual?'individual':'group'}-${x.id}`,l.panels[x.page])}</div><div class="group-hunt-options"><h2 class="reading">Yang manakah peribahasa dalam cerita?</h2>${audioBtn(GROUP_UI.hunt,'Dengar soalan')}<div class="stack">${x.options.map((t,i)=>`<div class="group-option">${button(individual?'find-individual':'find',syll(t),`data-id="${x.id}" data-index="${i}" ${found?'disabled':''}`,'light reading')}${audioBtn(t,'Dengar ungkapan '+(i+1),'answer-audio')}</div>`).join('')}</div><details class="group-hint"><summary>Lihat petunjuk</summary><p class="reading">${syll(x.hint)}</p>${audioBtn(x.hint,'Dengar petunjuk')}</details><div class="group-feedback" role="status">${found?`<h3>✓ Peribahasa ditemukan!</h3><p class="reading"><b>${syll(v.text)}</b><br>${syll(v.meaning)}</p>${audioBtn(`${plain(v.text)}. Maksudnya, ${v.meaning}. ${v.context}`,'Dengar maksud')}`:huntFeedback===x.id?`<p>${GROUP_UI.retry}</p>${audioBtn(GROUP_UI.retry,'Dengar bantuan')}`:''}</div></div></section>`;}
 function huntScreen(){return `${huntCard(h(),p().found)}${p().found?button('step','Bina halaman bersama →','data-step="1"'):''}`;}
 function field(key,label,value,help='',max=900){return `<div class="group-field"><label for="g-${key}">${label}</label>${help?`<p class="muted" id="help-${key}">${help}</p>`:''}<textarea class="input reading" id="g-${key}" data-gfield="${key}" maxlength="${max}" rows="3" ${help?`aria-describedby="help-${key}"`:''}>${esc(value)}</textarea></div>`;}
 function draftView(v){const x=h();return `<article class="group-page read-area"><span class="eyebrow">${PLACES[x.world].name} · HALAMAN CERITA ${x.page+1}</span><h2>${esc(plain(proverb(x.id).text))}</h2><div class="group-page-picture" role="img" aria-label="${esc(LEVELS[x.world].captions[v.picture])}">${storyIllustration(x.world,v.picture)}</div>${[['meaning','Maksud kami'],['evidence','Bukti daripada cerita'],['example','Contoh baharu kami']].map(([k,t])=>`<h3>${t}</h3><p class="reading">${syll(v[k])}</p>`).join('')}</article>`;}
 function cardList(){const bank=WRITING_CARDS[selected];return `<p>Permulaan ayat — lengkapkan bersama.</p><div class="writing-card-grid">${bank[cardTarget].map((t,i)=>`<div class="writing-card">${button('insert-card',syll(t),`data-kind="frame" data-card="${i}"`,'light')}${cardAudio(t,'Dengar permulaan ayat','answer-audio')}</div>`).join('')}</div><p>Perkataan untuk dibincangkan</p><div class="writing-card-grid">${bank.words.map((t,i)=>`<div class="writing-card">${button('insert-card',syll(t),`data-kind="word" data-card="${i}"`,'light')}${cardAudio(t,'Dengar '+t,'answer-audio')}</div>`).join('')}</div>`;}
 function writingSupport(){return `<details class="writing-support"><summary>Perlu bantuan menulis? Buka kad idea.</summary>${cardAudio(READING_UI.cards,'Dengar cara menggunakan kad')}<p>Kad membantu memulakan idea. Lengkapkan dan semak jawapan bersama. Guru membantu menilai ketepatannya.</p><label for="card-target">Tambahkan kad ke ruang</label><select class="input" id="card-target">${[['meaning','1. Maksud'],['evidence','2. Bukti'],['example','3. Contoh baharu']].map(([k,t])=>`<option value="${k}" ${cardTarget===k?'selected':''}>${t}</option>`).join('')}</select><div id="writing-card-list">${cardList()}</div>${button('undo-card','Undur tambahan terakhir','','light')}<p id="card-status" role="status"></p></details>`;}
 function insertText(key,text){const field=document.querySelector('#g-'+key);if(!field)return;const before=field.value,after=(before.trimEnd()+(before.trim()?' ':'')+text).slice(0,Number(field.maxLength));if(after===before){toast('Ruang ini sudah penuh. Sunting jawapan sebelum menambah kad.');return;}field.value=after;if(key.startsWith('idea-'))p().draft.ideas[key.slice(5)]=after;else p().draft[key]=after;lastInsert={page:selected,key,before,after};persist();const status=document.querySelector('#card-status');if(status)status.textContent='Kad ditambah. Lengkapkan idea dan semak ayat kamu.';field.focus({preventScroll:true});}
 function editor(){const a=p(),v=a.draft,isRevision=step===3;if(!isRevision&&a.history.length)return `<section class="card"><h2>Draf pertama telah disimpan</h2><p>Minta kumpulan jiran menyemak versi semasa sebelum menambah baik hasil.</p>${button('step','Dapatkan semakan rakan →','data-step="2"')}</section>${draftView(a.history.at(-1).draft)}`;
 return `<section class="card group-editor"><h2>${isRevision?'Baiki halaman bersama':'Bina draf pertama'}</h2>${audioBtn(isRevision?GROUP_UI.revise:GROUP_UI.draft,'Dengar panduan')}<p class="group-proverb reading">${syll(proverb(selected).text)}</p>${isRevision?`<aside class="group-review-note"><h3>Cadangan ${esc(a.review.by)}</h3><p>${esc(a.review.suggestion)}</p></aside>`:''}<p>Gunakan kata-kata sendiri. Jawapan boleh dibincangkan secara lisan sebelum pencatat menaip.</p>${writingSupport()}${field('meaning','1. Apakah maksud peribahasa ini?',v.meaning,'Kami memahami peribahasa ini sebagai…')}${field('evidence','2. Apakah bukti dalam cerita?',v.evidence,'Nyatakan watak, perbuatannya dan sebab perbuatan itu sesuai.')}${field('example','3. Cipta contoh baharu di sekolah atau di rumah.',v.example,'Fikirkan situasi lain yang menunjukkan maksud yang sama.')}<fieldset class="group-pictures"><legend>4. Pilih gambar yang menyokong bukti kamu.</legend>${LEVELS[h().world].captions.map((cap,i)=>`<label><input type="radio" name="group-picture" data-gpicture="${i}" ${v.picture===i?'checked':''}><span>${storyIllustration(h().world,i)}</span><small>${esc(cap)}</small></label>`).join('')}</fieldset><details class="group-ideas" open><summary>5. Catat satu idea daripada setiap ahli</summary><p>Boleh berupa pendapat, pilihan gambar, bukti atau contoh. Pencatat boleh membantu.</p>${book.members.map((name,i)=>field('idea-'+i,esc(name),v.ideas[i]||'','',240)+`<div class="group-idea-help">${button('idea-picture','Catat pilihan gambar',`data-member="${i}"`,'light small')}<p class="muted">Selepas ahli menunjuk gambar, pencatat boleh menambah sebab pilihannya pada ruang di atas.</p></div>`).join('')}</details>${isRevision?field('reason','Apakah yang kamu ubah dan mengapa?',a.reason,'Kami menambah baik… kerana…'):''}<div class="row">${button(isRevision?'save-revision':'save-draft',isRevision?'Simpan versi baharu →':'Simpan draf pertama →')}${button('source','Baca semula cerita','','light')}</div></section>`;}
 function reviewScreen(){const a=p();return `<div class="group-review-grid"><div>${draftView(a.history.at(-1).draft)}</div><section class="card"><h2>Kumpulan jiran menyemak</h2><p>Versi ${a.history.length} · tukar tempat atau berikan peranti kepada kumpulan jiran.</p>${audioBtn(GROUP_UI.review,'Dengar panduan semakan')}<p>Semak tiga perkara: maksud sesuai, bukti tepat dan contoh baharu jelas. Boleh rujuk PRPM bersama guru.</p><label for="review-by">Nama kumpulan penyemak</label><input class="input" id="review-by" data-greview="by" maxlength="60" value="${esc(a.reviewDraft.by)}"><label for="review-praise">Satu kekuatan halaman ini</label><textarea class="input reading" id="review-praise" data-greview="praise" rows="3" maxlength="900">${esc(a.reviewDraft.praise)}</textarea><label for="review-suggestion">Satu cadangan yang khusus</label><textarea class="input reading" id="review-suggestion" data-greview="suggestion" rows="3" maxlength="900" placeholder="Contoh: Nyatakan perbuatan Ravi supaya bukti lebih jelas.">${esc(a.reviewDraft.suggestion)}</textarea><p>${button('save-review','Simpan semakan & pulangkan →')}</p>${a.review?'<p class="notice">Semakan versi ini sudah disimpan. Kumpulan asal boleh ke langkah Baiki.</p>':''}</section></div>`;}
 function shareScreen(){const a=p();return `<div class="row">${button('book','Lihat seluruh buku')}${button('step','Minta semakan baharu','data-step="2"','light')}</div>${draftView(a.history.at(-1).draft)}${history(a)}${audioBtn(GROUP_UI.share,'Dengar cara berkongsi')}`;}
 function history(a){return `<details class="card group-history"><summary>Jejak pembaikan · ${a.history.length} versi</summary>${a.history.map(v=>`<section><h3>Versi ${v.number}</h3>${v.review?`<p><b>Pujian ${esc(v.review.by)}:</b> ${esc(v.review.praise)}</p><p><b>Cadangan:</b> ${esc(v.review.suggestion)}</p>`:''}<p><b>Catatan kumpulan:</b> ${esc(v.reason)}</p>${['meaning','evidence','example'].map(k=>`<p>${esc(v.draft[k])}</p>`).join('')}<p><b>Idea ahli:</b> ${book.members.map((n,i)=>`${esc(n)}: ${esc(v.draft.ideas[i]||'')}`).join(' · ')}</p></section>`).join('')}</details>`;}
 function bookMarkup(){return HUNTS.filter(x=>book.pages[x.id]?.history.length).map(x=>{const a=book.pages[x.id],v=a.history.at(-1),pr=proverb(x.id);return `<article class="group-page book-export-page"><p>${esc(book.team)} · ${PLACES[x.world].name} · Versi ${v.number}</p><h2>${esc(plain(pr.text))}</h2><div class="group-page-picture" role="img" aria-label="${esc(LEVELS[x.world].captions[v.draft.picture])}">${storyIllustration(x.world,v.draft.picture)}</div>${[['meaning','Maksud kami'],['evidence','Bukti cerita'],['example','Contoh baharu']].map(([k,t])=>`<h3>${t}</h3><p class="reading">${esc(v.draft[k])}</p>`).join('')}<p><b>Idea ahli:</b> ${book.members.map((n,i)=>`${esc(n)}: ${esc(v.draft.ideas[i])}`).join(' · ')}</p><p><a href="${pr.source}" target="_blank" rel="noopener">Semak maksud di PRPM</a></p><p>Bab ${x.world+1}, halaman ${x.page+1}. ${v.number===1?'Draf pertama · belum ditambah baik selepas semakan rakan.':'Telah ditambah baik selepas semakan rakan.'}</p>${history(a)}</article>`;}).join('');}
 function showBook(){const content=bookMarkup();frame(`<div class="wrap group-wrap">${title('Buku Peribahasa Budi')}<p class="reading">Karya ${esc(book.team)} · ${esc(book.members.join(', '))}</p><p>Ini hasil pemikiran murid. Guru membantu menyemak ketepatan maksud dan bukti sebelum digunakan oleh kumpulan lain.</p><div class="row">${audioBtn(GROUP_UI.share,'Dengar cara berkongsi')}${button('export-html','Muat turun buku (.html)',content?'':'disabled')}${button('export-json','Muat turun fail sambungan','','light')}</div>${content||'<p class="notice">Belum ada draf yang disimpan. Pilih satu misi untuk membina halaman pertama.</p>'}</div>`);}
 async function exportBook(){let font='';try{const r=await fetch(new URL('./assets/fonts/Andika-Regular.woff2',document.baseURI));if(r.ok){const bytes=new Uint8Array(await r.arrayBuffer());let b='';for(const n of bytes)b+=String.fromCharCode(n);font=`@font-face{font-family:Andika;src:url(data:font/woff2;base64,${btoa(b)})}`;}}catch{}
 const content=bookMarkup();if(!content)throw Error('Simpan satu draf dahulu.');const css=`${font}*{box-sizing:border-box}body{font-family:Andika,sans-serif;background:#fffdf5;color:#193f40;max-width:850px;margin:32px auto;padding:20px;line-height:1.8;font-size:20px;overflow-wrap:anywhere}h1,h2{line-height:1.3}h3{margin-bottom:0}p{white-space:pre-wrap}.group-page{border-top:2px solid #b3c69a;padding:32px 0}.group-page-picture{max-width:500px}svg{width:100%;height:auto}summary{font-weight:bold;cursor:pointer}a{color:#145f76}@media print{body{margin:0;font-size:14pt}.book-export-page{break-before:page}.group-history{display:block}details>summary{display:none}.group-page-picture{max-width:300px}a{color:inherit}}`;
 download(`<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buku Peribahasa Budi — ${esc(book.team)}</title><style>${css}</style><body><h1>Buku Peribahasa Budi</h1><p>Karya ${esc(book.team)}<br>${esc(book.members.join(', '))}</p><p>Hasil pembelajaran murid untuk disemak bersama guru. Gunakan Cetak pada pelayar untuk mencetak atau menyimpan sebagai PDF. Buka bahagian Jejak pembaikan untuk melihat versi terdahulu.</p>${content}</body></html>`,'Buku-Peribahasa-Budi.html','text/html;charset=utf-8');}
 function teacherGuide(){openDialog(`<h2>Aktiviti trialogikal: Buku Peribahasa Budi</h2>${audioBtn(GROUP_UI.teacher,'Dengar panduan guru')}<p>Murid membina satu hasil bersama yang boleh disemak, dibaiki dan digunakan semula. Cadangan: empat murid berkongsi satu peranti. Satu peribahasa memadai untuk sesi pertama.</p><ol><li><b>Baca dan cari (10 minit).</b> Setiap ahli memberi idea dahulu. Kumpulan mencari peribahasa dalam dialog watak.</li><li><b>Bincang dan bina (15 minit).</b> Persetujui maksud, bukti dan contoh baharu. Rekod sumbangan ahli dan simpan draf pertama.</li><li><b>Semak silang (10 minit).</b> Kumpulan jiran membaca hasil dan memberi satu pujian serta satu cadangan khusus.</li><li><b>Baiki (10 minit).</b> Kumpulan asal mengubah halaman berdasarkan cadangan, menjelaskan sebab dan menyimpan versi baharu.</li><li><b>Kongsi dan guna semula (10 minit).</b> Bentangkan halaman. Kumpulkan hasil untuk bacaan kelas; gunakan peribahasa dalam situasi lain pada sesi berikutnya.</li><li><b>Refleksi individu (5 minit).</b> Setiap murid menerangkan maksud, satu bukti dan sumbangannya sendiri.</li></ol><p>Anggaran 60 minit boleh dibahagi kepada dua sesi. Tukar peranan setiap misi. Guru boleh menugaskan satu peribahasa yang berbeza kepada setiap kumpulan.</p><h3>Bantuan mengikut keperluan</h3><p>Gunakan Garaj suku kata sebelum membaca. Baca satu ayat pada satu masa dan tekan mana-mana perkataan untuk mengulang bunyinya. Kad idea membantu memulakan ayat. Terima jawapan lisan dan pilihan gambar; pencatat merekodkannya. Rehat boleh diambil apabila diperlukan.</p><h3>Pemerhatian guru</h3><p>Buka Rekod pemerhatian murid di Ruang guru untuk mencatat bacaan, pemahaman cerita dan penjelasan peribahasa secara berasingan.</p><ul><li>Murid mengenal pasti ungkapan berkias.</li><li>Maksud, bukti cerita dan contoh baharu saling sepadan.</li><li>Setiap ahli menyumbang melalui lisan, gambar atau tulisan.</li><li>Hasil diperbaiki dengan alasan selepas menerima maklum balas.</li></ul><p>Catat “dengan bimbingan”, “semakin berdikari” atau “boleh menerangkan” bersama bukti pemerhatian. Jangan tentukan penguasaan individu berdasarkan hasil kumpulan sahaja.</p><p>Buku kumpulan disimpan pada peranti ini, berasingan daripada rekod markah kelas. Murid memuat turun buku untuk diberikan kepada guru; fail sambungan membolehkan penyuntingan diteruskan pada peranti lain.</p><p>Reka bentuk berasaskan <a href="https://doi.org/10.1080/21567069.2011.624171" target="_blank" rel="noopener">Paavola dan rakan-rakan (2011)</a>: membangunkan hasil bersama melalui proses berulang. Perbincangan dan penggunaan hasil oleh kumpulan lain perlu dilaksanakan oleh guru.</p>${button('go-group','Buka misi berkumpulan')}`);}
 function storyHunt(world){individualWorld=world;openDialog(`<h2>Detektif peribahasa · ${PLACES[world].name}</h2><p>Cari peribahasa dalam petikan. Kamu boleh menjawab sendiri atau berbincang dengan rakan.</p>${HUNTS.filter(x=>x.world===world).map(x=>huntCard(x,individualFound[x.id],true)).join('')}<p>Selepas menemukannya, bina halaman bersama dalam Misi berkumpulan.</p>${button('go-group','Ke buku kumpulan')}`);}
 function refresh(){mission();}
 async function act(action,el){stopSpeech();switch(action){
  case 'insert-card':{const bank=WRITING_CARDS[selected],list=el.dataset.kind==='frame'?bank[cardTarget]:bank.words,text=list[Number(el.dataset.card)];if(text)insertText(cardTarget,text);break;}
  case 'undo-card':{if(!lastInsert||lastInsert.page!==selected){toast('Belum ada kad untuk diundur pada halaman ini.');break;}const {key,before,after}=lastInsert,field=document.querySelector('#g-'+key);if(!field||field.value!==after){toast('Jawapan sudah disunting. Sunting sendiri supaya idea baharu tidak terpadam.');break;}field.value=before;if(key.startsWith('idea-'))p().draft.ideas[key.slice(5)]=before;else p().draft[key]=before;lastInsert=null;persist();field.focus();break;}
  case 'idea-picture':insertText('idea-'+el.dataset.member,'Saya memilih gambar: '+LEVELS[h().world].captions[p().draft.picture]+'.');break;
  case 'exit':navigate('home');break;case 'hub':open();break;
  case 'guide':teacherGuide();break;case 'go-group':closeDialog();navigate('group');break;
  case 'mission':selected=el.dataset.id;if(!HUNTS.some(v=>v.id===selected))return;step=0;huntFeedback='';mission();break;
  case 'step':if(allowed(Number(el.dataset.step))){step=Number(el.dataset.step);refresh();}break;
  case 'find':case 'find-individual':{const x=HUNTS.find(v=>v.id===el.dataset.id);if(!x)return;const good=Number(el.dataset.index)===x.answer;huntFeedback=good?'':x.id;if(action==='find'){if(good){p().found=true;persist();}refresh();}else{if(good){individualFound[x.id]=true;try{localStorage.setItem('misi-budi-peribahasa-v1',JSON.stringify(individualFound));}catch{}}storyHunt(individualWorld);}document.querySelector(`[data-hunt="${x.id}"] .group-feedback`)?.scrollIntoView({block:'nearest'});break;}
  case 'save-draft':commitDraft(book,p());persist();step=2;refresh();break;
  case 'save-review':commitReview(p());persist();step=3;refresh();break;
  case 'save-revision':commitRevision(book,p());persist();step=4;refresh();break;
  case 'source':{const x=h();openDialog(`<h2>${LEVELS[x.world].title}</h2>${LEVELS[x.world].panels.map((line,i)=>`<section><h3>Halaman ${i+1}</h3>${audioBtn(line,'Dengar halaman '+(i+1))}${reader(`source-${x.world}-${i}`,line)}</section>`).join('')}`);break;}
  case 'book':showBook();break;
  case 'export-json':download(JSON.stringify(book,null,2),'Sambungan-Buku-Peribahasa-Budi.json','application/json');break;
  case 'export-html':await exportBook();break;
  case 'new':openDialog(`<h2>Mulakan buku kumpulan baharu?</h2><p>Muat turun fail sambungan dahulu jika buku semasa masih diperlukan. Buku semasa pada peranti ini akan diganti.</p>${button('export-json','Muat turun buku semasa','','light')}${button('confirm-new','Ya, cipta buku baharu')}`);break;
  case 'confirm-new':book=null;try{localStorage.removeItem(GROUP_KEY);}catch{}closeDialog();setup();break;
  case 'confirm-import':if(imported){book=imported;imported=null;persist();closeDialog();hub();}break;
 }}
 document.addEventListener('click',e=>{const el=e.target.closest('[data-gaction]');if(!el||el.disabled)return;e.preventDefault();Promise.resolve().then(()=>act(el.dataset.gaction,el)).catch(err=>error(err.message));});
 document.addEventListener('submit',e=>{if(e.target.id!=='group-setup')return;e.preventDefault();const team=$('#group-name').value.trim(),members=$('#group-members').value.split(/\n/).map(s=>s.trim()).filter(Boolean);if(!team||members.length<2||members.length>6||members.some(n=>n.length>30)){error('Isi nama kumpulan dan 2–6 nama panggilan, satu nama setiap baris. Setiap nama maksimum 30 aksara.');return;}book=newGroup(team,members);persist();hub();});

M['adaptive-core']=(()=>{
const {QUESTIONS}=M['data'];
const {same,completed,grade,skillStats}=M['scoring'];
const {ADAPTIVE_BANKS}=M['adaptive-data'];
function learningProfile(attempts={}){const done=completed(attempts),first=QUESTIONS.filter(q=>grade(q,attempts[q.id])===5).length,skills=skillStats(attempts);const weakest=Object.keys(skills).sort((a,b)=>skills[a].first/skills[a].total-skills[b].first/skills[b].total);return {ready:done===QUESTIONS.length,done,first,percent:Math.round(first/QUESTIONS.length*100),route:first<10?'pemulihan':first<16?'pengukuhan':'pengayaan',weakest,skills};}
function selectedExercises(profile){return [...ADAPTIVE_BANKS[profile.route]].sort((a,b)=>profile.weakest.indexOf(a.skill)-profile.weakest.indexOf(b.skill)).slice(0,3);}
function newAdaptive(attempts){const profile=learningProfile(attempts);if(!profile.ready)return null;return {version:1,route:profile.route,ids:selectedExercises(profile).map(q=>q.id),tries:{},hints:[],draft:{mode:'tulis',situation:'',action:'',proverb:'',reason:''},submitted:false};}
function adaptiveSummary(record,attempts){const p=learningProfile(attempts);if(!p.ready)return {route:null,first:p.first,percent:p.percent,solved:0,firstPractice:0,status:'Belum selesai 20 misi'};const qs=selectedExercises(p),r=record||{},solved=qs.filter(q=>(r.tries?.[q.id]||[]).includes(q.answer)).length,firstPractice=qs.filter(q=>r.tries?.[q.id]?.[0]===q.answer).length;return {route:p.route,first:p.first,percent:p.percent,solved,firstPractice,status:solved<3?(solved?'Sedang berlatih':'Belum mula'):p.route==='pengayaan'?(r.submitted?'Idea dihantar · perlu semakan guru':'Jawapan selesai · bina contoh sendiri'):'Selesai latihan',complete:solved===3&&(p.route!=='pengayaan'||r.submitted===true)};}
// Used by the server as well as the client: route, item IDs and completion are derived, never trusted.
function validateAdaptive(input,attempts,previous=null){
 if(input===undefined)return previous;if(input===null&&previous)return previous;if(input===null)return null;
 const out=newAdaptive(attempts);if(!out)throw Error('Selesaikan 20 misi sebelum menghantar latihan susulan.');
 if(!input||typeof input!=='object'||Array.isArray(input)||input.version!==1||input.route!==out.route||!same(input.ids,out.ids)||!input.tries||typeof input.tries!=='object'||Array.isArray(input.tries))throw Error('Rekod latihan susulan tidak sah.');
 const qs=selectedExercises(learningProfile(attempts));for(const [id,tries]of Object.entries(input.tries)){const q=qs.find(q=>q.id===id);if(!q||!Array.isArray(tries)||tries.length>12||tries.some(v=>!Number.isInteger(v)||v<0||v>=q.options.length))throw Error('Pilihan latihan susulan tidak sah.');const at=tries.indexOf(q.answer);if(at>=0&&at!==tries.length-1)throw Error('Jawapan selepas latihan selesai tidak diterima.');out.tries[id]=[...tries];}
 for(const [id,old]of Object.entries(previous?.tries||{})){if(!old.every((v,i)=>out.tries[id]?.[i]===v))throw Error('Sejarah latihan yang disimpan tidak boleh dipadam.');}
 if(input.hints!==undefined&&(!Array.isArray(input.hints)||input.hints.some(id=>!out.ids.includes(id))))throw Error('Petunjuk latihan tidak sah.');out.hints=[...new Set([...(previous?.hints||[]),...(input.hints||[])])];
 const d=input.draft||{};out.draft={mode:d.mode==='lisan'?'lisan':'tulis',...Object.fromEntries(['situation','action','proverb','reason'].map(k=>[k,String(d[k]||'').trim().slice(0,600)]))};
 out.submitted=out.route==='pengayaan'&&input.submitted===true;if(out.submitted&&(!['situation','action','proverb','reason'].every(k=>out.draft[k])||!qs.every(q=>(out.tries[q.id]||[]).includes(q.answer))))throw Error('Lengkapkan latihan dan contoh peribahasa dahulu.');
 if(previous?.submitted&&!out.submitted)throw Error('Contoh yang dihantar tidak boleh ditandakan belum dihantar.');

p>${syll(f.text)}</p>${audioBtn(f.text,'Dengar penerangan')}<div class="row">${f.good?button('next',index===2?(p.route==='pengayaan'?'Bina contoh sendiri →':'Lihat kemajuan →'):'Latihan seterusnya →'):button('retry','Cuba lagi')}</div></div>`:''}<div class="row adaptive-help">${button('hint',showHint?'Baca petunjuk di bawah':'Buka petunjuk','','light')}${button('exit','Simpan & kembali','','outline')}</div>${showHint?`<aside class="adaptive-hint"><h3>Petunjuk</h3><p>${syll(q.model||q.context)}</p>${audioBtn(q.model||q.context,'Dengar petunjuk')}<p>${esc(ADAPTIVE_UI.retry)}</p>${audioBtn(ADAPTIVE_UI.retry,'Dengar bantuan')}</aside>`:''}<p class="muted">Tiada had masa. Jawapan kamu disimpan pada peranti ini${s.code?' dan dihantar ke kelas apabila ada sambungan':''}.</p></section></div>`);
